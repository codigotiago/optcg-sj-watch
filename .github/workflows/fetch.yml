name: Fetch OPCG San Jose events

on:
  schedule:
    # 07:00 UTC = 12:00am PDT. Routine reads the result at 07:05.
    - cron: "0 7 * * *"
    # 15:55 UTC = 8:55am PDT. Routine reads the result at 16:05.
    - cron: "55 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch event list from Bandai TCG+
        run: |
          set -euo pipefail
          # The API 403s a bare curl UA; it needs a browser-like User-Agent.
          UA='User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36'
          ACCEPT='Accept: application/json'
          REFERER='Referer: https://www.bandai-tcg-plus.com/'
          URL='https://api.bandai-tcg-plus.com/api/user/event/list?game_title_id=4&country_code[]=US&organizer_id=9297&limit=100&offset=0&order=1'
          for attempt in 1 2 3; do
            if curl -sSf --max-time 30 -H "$UA" -H "$ACCEPT" -H "$REFERER" "$URL" -o raw.json; then
              break
            fi
            echo "attempt $attempt failed" >&2
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
          # Fail loudly if the shape changed, rather than committing junk.
          jq -e '.success.event_list | type == "array"' raw.json > /dev/null

      - name: Diff against the previous snapshot
        run: |
          set -euo pipefail
          # events.json from the checkout is the PREVIOUS run's snapshot.
          # Anything whose id is absent from it is genuinely new. This is what
          # makes twice-daily checks safe: no time window, so no duplicate alerts.
          if [ -f events.json ]; then
            jq '[.events[].id]' events.json > prev_ids.json
          else
            # First ever run: treat everything as already-seen so we don't
            # blast the whole existing calendar as "new".
            jq '[.success.event_list[].id]' raw.json > prev_ids.json
          fi

          jq --slurpfile prev prev_ids.json --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
            def clean:
              { id, event_series_title, excerpt,
                start_datetime, timezone, apply_start_datetime,
                event_created_at, event_updated_at,
                max_join_count, is_over_max_join_count,
                applicationOpen, is_canceled,
                entryFee, entry_fee_currency_code,
                street_address, city_code,
                url: ("https://www.bandai-tcg-plus.com/event/detail/" + (.id|tostring)) };
            ($prev[0]) as $seen
            | [ .success.event_list[] | clean ] as $all
            | { fetched_at: $ts,
                total: (.success.total // 0),
                new_events: [ $all[] | select((.id | IN($seen[])) | not) | select(.is_canceled == false) ],
                events: $all }
          ' raw.json > next.json

          mv next.json events.json
          rm -f raw.json prev_ids.json
          jq -r '"\(.total) events, \(.new_events|length) new, at \(.fetched_at)"' events.json

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "opcg-watch-bot"
          git config user.email "actions@github.com"
          git add events.json
          # Always commit: fetched_at changes every run, and the routine relies on
          # new_events being reset to [] once an alert has gone out.
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git push
