name: Fetch OPCG San Jose events

on:
  schedule:
    # Fetch, render and send all happen in this one job, so these times are
    # simply when you get emailed. Retime them freely.
    # 23:45 UTC = 4:45pm PT
    - cron: "45 23 * * *"
    # 02:45 UTC = 7:45pm PT
    - cron: "45 2 * * *"
    # 06:45 UTC = 11:45pm PT
    - cron: "45 6 * * *"
    # 15:45 UTC = 8:45am PT
    - cron: "45 15 * * *"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Alert on every upcoming event, ignoring the ledger"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch event lists from Bandai TCG+
        run: |
          set -euo pipefail
          # The API 403s a bare curl UA; it needs a browser-like User-Agent.
          UA='User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36'
          ACCEPT='Accept: application/json'
          REFERER='Referer: https://www.bandai-tcg-plus.com/'
          BASE='https://api.bandai-tcg-plus.com/api/user/event/list?game_title_id=4&country_code[]=US&limit=100&offset=0&order=1'

          # organizer_id -> short label used in the alert emails.
          fetch_one() {
            local oid="$1" out="$2"
            for attempt in 1 2 3; do
              if curl -sSf --max-time 30 -H "$UA" -H "$ACCEPT" -H "$REFERER" "$BASE&organizer_id=$oid" -o "$out"; then
                jq -e '.success.event_list | type == "array"' "$out" > /dev/null
                return 0
              fi
              echo "organizer $oid attempt $attempt failed" >&2
              sleep 10
            done
            return 1
          }

          # Both stores must succeed. A partial fetch would look like events
          # were deleted, and silently stop alerting for that store.
          fetch_one 9297 sj.json
          fetch_one 1339 ca.json

          jq -s '{ success: { total: ((.[0].success.total // 0) + (.[1].success.total // 0)),
                              event_list: (.[0].success.event_list + .[1].success.event_list) } }'             sj.json ca.json > raw.json
          rm -f sj.json ca.json
          jq -r '"fetched \(.success.event_list | length) events across both stores"' raw.json

      - name: Fetch applicant counts
        run: |
          set -euo pipefail
          UA='User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36'
          ACCEPT='Accept: application/json'
          REFERER='Referer: https://www.bandai-tcg-plus.com/'

          # count_applicants only exists on the per-event endpoint, so this is
          # one request per event. Seats are first-come-first-served, so how
          # full an event already is decides whether signing up means a seat or
          # a 6am queue for a no-show.
          : > counts.jsonl
          for id in $(jq -r '.success.event_list[].id' raw.json); do
            if curl -sSf --max-time 20 -H "$UA" -H "$ACCEPT" -H "$REFERER"                  "https://api.bandai-tcg-plus.com/api/user/event/$id" -o one.json; then
              # entry_type 1 = first-come, 2 = lottery (the list endpoint does
              # not carry it, only this per-event one does). No "// null" on it:
              # jq treats false as empty, so that idiom silently nulls booleans.
              jq -c --argjson id "$id" '{id: $id,
                count_applicants: (.success.count_applicants // null),
                entry_type: (.success.event.entry_type),
                apply_end_datetime: (.success.event.apply_end_datetime)}' one.json >> counts.jsonl
            else
              # A miss must not fail the run - a missing count still leaves a
              # usable alert. null renders as "unknown" rather than a wrong number.
              echo "{\"id\": $id, \"count_applicants\": null, \"entry_type\": null, \"apply_end_datetime\": null}" >> counts.jsonl
              echo "count lookup failed for $id" >&2
            fi
            sleep 0.4
          done
          rm -f one.json
          jq -s 'map(select(.count_applicants != null)) | length' counts.jsonl             | xargs -I{} echo "got applicant counts for {} events"

      - name: Build events.json
        run: |
          set -euo pipefail
          # Only fields something actually reads: alert.py renders from them and
          # index.html renders from a subset. Everything else the API returns is
          # dropped rather than committed and diffed four times a day.
          jq -s 'map({key: (.id|tostring), value: .}) | from_entries' counts.jsonl > counts.json

          jq --slurpfile counts counts.json --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
            ($counts[0]) as $extra
            | { fetched_at: $ts,
                events: [ .success.event_list[] |
                  ($extra[(.id|tostring)]) as $x |
                  { id, event_series_title, start_datetime,
                    max_join_count, is_canceled,
                    entryFee, entry_fee_currency_code,
                    organizer_id, organizer_name,
                    url: ("https://www.bandai-tcg-plus.com/event/" + (.id|tostring)),
                    count_applicants: $x.count_applicants,
                    entry_type: $x.entry_type,
                    apply_end_datetime: $x.apply_end_datetime } ] }
          ' raw.json > next.json

          mv next.json events.json
          rm -f raw.json counts.json counts.jsonl
          jq -r '"\(.events | length) events, \([.events[] | select(.entry_type == 2)] | length) lottery, at \(.fetched_at)"' events.json

      - name: Render and send the alert
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
        run: |
          set -euo pipefail
          # Exits 0 whether or not it had anything to send. It only rewrites
          # alerted.json after the send succeeds, so a failed send leaves the
          # event unalerted and the next run retries it.
          python3 alert.py ${{ inputs.force_all && '--force-all' || '' }}

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "opcg-watch-bot"
          git config user.email "actions@github.com"
          git add events.json alerted.json
          # Always commit: fetched_at changes every run.
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git push
