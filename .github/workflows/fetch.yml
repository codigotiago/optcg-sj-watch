name: Fetch OPCG San Jose events

on:
  schedule:
    # 23:45 UTC = 4:45pm PDT. Routine reads the result at 00:05 (5:05pm).
    - cron: "45 23 * * *"
    # 02:45 UTC = 7:45pm PDT. Routine reads the result at 03:05 (8:05pm).
    - cron: "45 2 * * *"
    # 06:45 UTC = 11:45pm PDT. Routine reads the result at 07:05 (12:05am).
    - cron: "45 6 * * *"
    # 15:45 UTC = 8:45am PDT. Routine reads the result at 16:05 (9:05am).
    # The 20-minute gap absorbs raw.githubusercontent.com's ~5 min CDN TTL
    # and GitHub's habit of running scheduled workflows late.
    - cron: "45 15 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch event lists from Bandai TCG+
        run: |
          set -euo pipefail
          # The API 403s a bare curl UA; it needs a browser-like User-Agent.
          UA='User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36'
          ACCEPT='Accept: application/json'
          REFERER='Referer: https://www.bandai-tcg-plus.com/'
          BASE='https://api.bandai-tcg-plus.com/api/user/event/list?game_title_id=4&country_code[]=US&limit=100&offset=0&order=1'

          # organizer_id -> short label used in the alert emails.
          fetch_one() {
            local oid="$1" out="$2"
            for attempt in 1 2 3; do
              if curl -sSf --max-time 30 -H "$UA" -H "$ACCEPT" -H "$REFERER" "$BASE&organizer_id=$oid" -o "$out"; then
                jq -e '.success.event_list | type == "array"' "$out" > /dev/null
                return 0
              fi
              echo "organizer $oid attempt $attempt failed" >&2
              sleep 10
            done
            return 1
          }

          # Both stores must succeed. A partial fetch would look like events
          # were deleted, and silently stop alerting for that store.
          fetch_one 9297 sj.json
          fetch_one 1339 ca.json

          jq -s '{ success: { total: ((.[0].success.total // 0) + (.[1].success.total // 0)),
                              event_list: (.[0].success.event_list + .[1].success.event_list) } }'             sj.json ca.json > raw.json
          rm -f sj.json ca.json
          jq -r '"fetched \(.success.event_list | length) events across both stores"' raw.json

      - name: Fetch applicant counts
        run: |
          set -euo pipefail
          UA='User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36'
          ACCEPT='Accept: application/json'
          REFERER='Referer: https://www.bandai-tcg-plus.com/'

          # count_applicants only exists on the per-event endpoint, so this is
          # one request per event. Seats are first-come-first-served, so how
          # full an event already is decides whether signing up means a seat or
          # a 6am queue for a no-show.
          : > counts.jsonl
          for id in $(jq -r '.success.event_list[].id' raw.json); do
            if curl -sSf --max-time 20 -H "$UA" -H "$ACCEPT" -H "$REFERER"                  "https://api.bandai-tcg-plus.com/api/user/event/$id" -o one.json; then
              jq -c --argjson id "$id" '{id: $id, count_applicants: (.success.count_applicants // null)}' one.json >> counts.jsonl
            else
              # A miss must not fail the run - a missing count still leaves a
              # usable alert. null renders as "unknown" rather than a wrong number.
              echo "{\"id\": $id, \"count_applicants\": null}" >> counts.jsonl
              echo "count lookup failed for $id" >&2
            fi
            sleep 0.4
          done
          rm -f one.json
          jq -s 'map(select(.count_applicants != null)) | length' counts.jsonl             | xargs -I{} echo "got applicant counts for {} events"

      - name: Stamp first_seen_at
        run: |
          set -euo pipefail
          # Each event carries first_seen_at: the UTC time this workflow FIRST
          # observed that id. It never changes afterwards, so the routine can
          # ask "posted since when?" without needing state of its own.
          #
          # Deliberately NOT a diff against the previous snapshot: if a
          # scheduled run lands late, a diff would mark the event new on a run
          # nobody reads and clear it before the next one, losing the alert
          # entirely. A stable stamp only ever risks a duplicate email.
          if [ -f events.json ]; then
            jq '[.events[] | {id, first_seen_at}]' events.json > prev_seen.json
          else
            echo '[]' > prev_seen.json
          fi
          jq -s 'map({key: (.id|tostring), value: .count_applicants}) | from_entries' counts.jsonl > counts.json

          jq --slurpfile prev prev_seen.json --slurpfile counts counts.json --arg ts "$(date -u +%Y-%m-%dT%H:%M:%SZ)" '
            ($prev[0] | map({key: (.id|tostring), value: .first_seen_at}) | from_entries) as $seen
            | ($counts[0]) as $napp
            | { fetched_at: $ts,
                total: (.success.total // 0),
                events: [ .success.event_list[] |
                  { id, event_series_title, excerpt,
                    start_datetime, timezone, apply_start_datetime,
                    event_created_at, event_updated_at,
                    max_join_count, is_over_max_join_count,
                    applicationOpen, is_canceled,
                    entryFee, entry_fee_currency_code,
                    street_address, city_code,
                    organizer_id, organizer_name,
                    store: (if (.organizer_id == 9297) then "San Jose (walk)" else "CardArt Sunnyvale (drive)" end),
                    url: ("https://www.bandai-tcg-plus.com/event/" + (.id|tostring)),
                    first_seen_at: ($seen[(.id|tostring)] // $ts),
                    count_applicants: $napp[(.id|tostring)],
                    seats_left: (if $napp[(.id|tostring)] == null then null
                                 else (.max_join_count - $napp[(.id|tostring)]) end) } ] }
          ' raw.json > next.json

          mv next.json events.json
          rm -f raw.json prev_seen.json counts.json counts.jsonl
          jq -r '.fetched_at as $t | "\(.total) events, \([.events[] | select(.first_seen_at == $t)] | length) first seen this run, at \($t)"' events.json

      - name: Commit
        run: |
          set -euo pipefail
          git config user.name "opcg-watch-bot"
          git config user.email "actions@github.com"
          git add events.json
          # Always commit: fetched_at changes every run, and the routine relies on
          # new_events being reset to [] once an alert has gone out.
          git commit -m "snapshot $(date -u +%Y-%m-%dT%H:%MZ)" || echo "nothing to commit"
          git push
